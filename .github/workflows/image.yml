name: Build image

# Builds the production image (API + website in one container) on every push to main and
# pushes it to GitHub Container Registry, tagged with the commit SHA. Alternate Clouds runs
# that tag: acc services deploy kapra-planner --image ghcr.io/raheemxghumman/kapra-planner:<sha>
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    name: Build and push image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Alternate Clouds caches images by tag and refuses moving tags, so deploys use the SHA.
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: api/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ github.sha }}
          build-args: RELEASE=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
