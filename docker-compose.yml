# Local PostgreSQL for development and end-to-end tests.
# Start: docker compose up -d   Stop: docker compose down   Wipe data: docker compose down -v
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: kapra
      POSTGRES_PASSWORD: kapra
      POSTGRES_DB: kapra
    ports:
      - '5432:5432'
    volumes:
      - kapra-db:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U kapra']
      interval: 5s
      retries: 10

volumes:
  kapra-db:
